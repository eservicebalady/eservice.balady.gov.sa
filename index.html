    const timestamp = new Date().getTime();
    const uniqueID = Math.random().toString(36).substring(2, 8);
    const filename = queryString ? `${queryString}_${uniqueID}_${timestamp}.pdf` : `certificate_${uniqueID}.pdf`;

    try {
      // Small delay to ensure images are rendered
      await new Promise(r => setTimeout(r, 1200));

      const canvas = await html2canvas(element, {
        scale: 2,
        useCORS: true,
        backgroundColor: "#fff"
      });

      const imgData = canvas.toDataURL("image/jpeg", 1.0);
      const pdfWidth = 65.5;
      const pdfHeight = 180;
      const pdf = new jsPDF('p', 'mm', [pdfHeight, pdfWidth]);

      const pxPerMm = canvas.width / element.offsetWidth;
      const imgProps = {
        mmWidth: canvas.width / pxPerMm,
        mmHeight: canvas.height / pxPerMm
      };

      const scale = pdfWidth / imgProps.mmWidth;
      const imgHeight = imgProps.mmHeight * scale;

      pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, imgHeight);
      
      // ONLY download trigger in the entire file
      pdf.save(filename);

    } catch (error) {
      console.error("PDF generation error:", error);
    }
  });
</script>

<script>
document.documentElement.setAttribute('translate', 'no');
document.body.setAttribute('translate', 'no');

document.querySelectorAll('*').forEach(el => {
    el.setAttribute('translate', 'no');
    el.classList.add('notranslate');
});
</script>
